name: Build SolidFlow Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SolidFlowUX/**'
      - 'installer/**'
      - '.github/workflows/build-windows-installer.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify complete SolidFlow runtime tree
        shell: pwsh
        run: |
          $required = @(
            'SolidFlowUX/Init.py',
            'SolidFlowUX/InitGui.py',
            'SolidFlowUX/solidflow_ui.py',
            'SolidFlowUX/solidflow_features.py',
            'SolidFlowUX/solidflow_smart.py',
            'SolidFlowUX/solidflow_sketch.py',
            'SolidFlowUX/solidflow_import.py',
            'SolidFlowUX/solidflow_viewbar.py',
            'SolidFlowUX/solidflow_beta5.py',
            'SolidFlowUX/solidflow_beta6.py',
            'SolidFlowUX/solidflow_mesh.py',
            'SolidFlowUX/solidflow_appearance.py',
            'SolidFlowUX/solidflow_beta7.py',
            'SolidFlowUX/solidflow_profiles.py',
            'SolidFlowUX/solidflow_fillet.py',
            'SolidFlowUX/solidflow_paths.py',
            'SolidFlowUX/solidflow_workflows.py',
            'SolidFlowUX/solidflow_beta12.py',
            'SolidFlowUX/manifest.txt',
            'installer/SolidFlowUX.iss',
            'installer/SolidFlowUX-preinstall.ps1'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error ('Installer source tree incomplete. Missing: ' + ($missing -join ', '))
            exit 1
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        shell: pwsh
        run: |
          $runtime = Get-Content 'SolidFlowUX/manifest.txt' |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') -and $_.EndsWith('.py') }
          foreach ($file in $runtime) {
            python -m py_compile (Join-Path 'SolidFlowUX' $file)
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw 'Inno Setup compiler not found.'
          }
          & $iscc 'installer\SolidFlowUX.iss'

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Installer EXE not found.' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii 'dist\SHA256SUMS.txt'
          Write-Host "SHA256: $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolidFlowUX-Windows-Installer
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
