name: Build SolidFlow Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths: ['SolidFlowUX/**', 'installer/**', 'tools/**', 'tests/**', 'CHECK_SOURCE.ps1', 'BUILD_INSTALLER_LOCAL.ps1', '.github/workflows/build-windows-installer.yml']
  push:
    branches: [main]
    paths: ['SolidFlowUX/**', 'installer/**', 'tools/**', 'tests/**', 'CHECK_SOURCE.ps1', 'BUILD_INSTALLER_LOCAL.ps1', '.github/workflows/build-windows-installer.yml']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read SolidFlow version
        id: version
        shell: pwsh
        run: |
          $iss = Get-Content 'installer/SolidFlowUX.iss' -Raw
          if ($iss -notmatch '#define MyAppVersion "([^"]+)"') { throw 'Version missing' }
          "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Check source and installer file coverage
        shell: pwsh
        run: .\CHECK_SOURCE.ps1 -Strict
      - name: Test installation, rollback, diagnostics and lazy commands
        run: python -m unittest discover -s tests -v
      - name: Test Windows pre-install backup
        shell: pwsh
        run: .\tests\test_preinstall.ps1
      - name: Build offline tester package
        run: python tools/build_tester_package.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer\SolidFlowUX.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed' }
      - name: Verify actual EXE installation in a custom profile
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'FreeCAD test profile\Mod\SolidFlowUX'
          $exe = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          $process = Start-Process $exe.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Setup failed: $($process.ExitCode)" }
          $files = Get-Content SolidFlowUX/manifest.txt | Where-Object { $_.Trim() -and -not $_.StartsWith('#') }
          foreach ($file in $files) {
            $installed = Join-Path $target $file.Trim()
            if (-not (Test-Path $installed)) { throw "Not installed: $file" }
            if ((Get-FileHash $installed).Hash -ne (Get-FileHash (Join-Path 'SolidFlowUX' $file.Trim())).Hash) { throw "Wrong contents: $file" }
          }
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip', '.FCMacro' } | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SolidFlowUX-Windows-Installer
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.FCMacro
            dist/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    needs: build-installer
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SolidFlowUX-Windows-Installer
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-installer.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SolidFlow UX ${{ needs.build-installer.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
